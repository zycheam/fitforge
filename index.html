<script src="exercises_data.js"></script>
<script>
const IMG_BASE = 'https://raw.githubusercontent.com/yuhonas/free-exercise-db/master/exercises';
const SHARE_BASE_URL = window.location.origin + window.location.pathname;
let allExercises = [], filteredExercises = [];
let currentPage = 1, PAGE_SIZE = 12, currentView = 'grid';
let activeFilters = { category: null, level: null, equipment: null, muscle: null };
let currentDay = 'day1';
const DAYS = ['day1','day2','day3','day4','day5','day6','day7'];
const DAY_LABELS = { day1:'周一', day2:'周二', day3:'周三', day4:'周四', day5:'周五', day6:'周六', day7:'周日' };

function getPlan() { try { return JSON.parse(localStorage.getItem('fitforge_plan') || '{}'); } catch(e) { return {}; } }
function savePlan(plan) { localStorage.setItem('fitforge_plan', JSON.stringify(plan)); updatePlanBadge(); }

// Display name: prefer Chinese
function displayName(ex) { return ex.name_cn || ex.name; }
function displayInstructions(ex) { return (ex.instructions_cn && ex.instructions_cn.length > 0) ? ex.instructions_cn : ex.instructions; }

function loadData() {
  try {
    if (!window.EXERCISES || !window.EXERCISES.length) throw new Error('数据未加载');
    allExercises = window.EXERCISES;
    // Sort by Chinese name if available
    allExercises.sort((a,b) => (a.name_cn || a.name).localeCompare(b.name_cn || b.name));
    filteredExercises = [...allExercises];
    initFilters();
    renderAll();
    document.getElementById('loading').style.display = 'none';
  } catch(e) {
    document.getElementById('loading').innerHTML = '<p style="color:#F87171">数据加载失败</p><p style="color:var(--text-muted);font-size:0.8125rem;margin-top:6px">请确保 exercises_data.js 与 index.html 在同一目录</p>';
  }
}

let categories=[], levels=[], equipments=[], muscles=[];

function initFilters() {
  const catSet=new Set(), lvlSet=new Set(), eqSet=new Set(), musSet=new Set();
  allExercises.forEach(ex => {
    if(ex.category) catSet.add(ex.category);
    if(ex.level) lvlSet.add(ex.level);
    if(ex.equipment) eqSet.add(ex.equipment);
    if(ex.primaryMuscles) ex.primaryMuscles.forEach(m=>musSet.add(m));
    if(ex.secondaryMuscles) ex.secondaryMuscles.forEach(m=>musSet.add(m));
  });
  categories=[...catSet].sort();
  levels=[...lvlSet].sort((a,b)=>['beginner','intermediate','expert'].indexOf(a)-['beginner','intermediate','expert'].indexOf(b));
  equipments=[...eqSet].sort();
  muscles=[...musSet].sort();
  renderFilterChips('category-filters',categories,'category');
  renderFilterChips('level-filters',levels,'level');
  renderFilterChips('equipment-filters',equipments,'equipment');
  renderMuscleFilters();
}

function renderFilterChips(id,items,type){
  document.getElementById(id).innerHTML=items.map(v=>
    `<button class="filter-chip" data-value="${v}" onclick="toggleFilter('${type}','${v.replace(/'/g,"\\'")}')">${formatLabel(v)}</button>`
  ).join('');
}

function renderMuscleFilters(){
  document.getElementById('muscle-filters').innerHTML=muscles.map(m=>
    `<button class="muscle-chip" data-value="${m}" onclick="toggleFilter('muscle','${m.replace(/'/g,"\\'")}')">${formatLabel(m)}</button>`
  ).join('');
}

function formatLabel(s){
  if(!s) return '';
  const map={
    'beginner':'入门','intermediate':'中级','expert':'高级',
    'strength':'力量训练','stretching':'拉伸','plyometrics':'增强式','powerlifting':'力量举',
    'olympic weightlifting':'举重','strongman':'大力士','cardio':'有氧',
    'body only':'徒手','barbell':'杠铃','dumbbell':'哑铃','cable':'绳索','machine':'器械',
    'kettlebells':'壶铃','bands':'弹力带','medicine ball':'药球','exercise ball':'健身球',
    'foam roll':'泡沫轴','e-z curl bar':'曲杠','other':'其他',
    'abdominals':'腹肌','abductors':'外展肌','adductors':'内收肌','biceps':'肱二头肌',
    'calves':'小腿','chest':'胸肌','forearms':'前臂','glutes':'臀肌','hamstrings':'腘绳肌',
    'lats':'背阔肌','lower back':'下背','middle back':'中背','neck':'颈部',
    'quadriceps':'股四头肌','shoulders':'肩部','traps':'斜方肌','triceps':'肱三头肌',
    'isolation':'孤立','compound':'复合','static':'静态','pull':'拉力','push':'推力'
  };
  return map[s] || s.replace(/_/g,' ').replace(/\b\w/g,c=>c.toUpperCase());
}

function toggleFilter(type,value){
  activeFilters[type]=activeFilters[type]===value?null:value;
  updateFilterUI(); filterAndRender();
}

function updateFilterUI(){
  document.querySelectorAll('.filter-chip,.muscle-chip').forEach(btn=>{
    const type=btn.closest('#muscle-filters')?'muscle':btn.closest('#category-filters')?'category':btn.closest('#level-filters')?'level':'equipment';
    btn.classList.toggle('active',activeFilters[type]===btn.dataset.value);
  });
}

function filterAndRender(){
  const search=document.getElementById('search').value.toLowerCase().trim();
  filteredExercises=allExercises.filter(ex=>{
    const name=(ex.name_cn||ex.name).toLowerCase();
    if(search && !name.includes(search) && !ex.name.toLowerCase().includes(search)) return false;
    if(activeFilters.category && ex.category!==activeFilters.category) return false;
    if(activeFilters.level && ex.level!==activeFilters.level) return false;
    if(activeFilters.equipment && ex.equipment!==activeFilters.equipment) return false;
    if(activeFilters.muscle){
      const allM=[...(ex.primaryMuscles||[]),...(ex.secondaryMuscles||[])];
      if(!allM.includes(activeFilters.muscle)) return false;
    }
    return true;
  });
  const sort=document.getElementById('sort-select').value;
  filteredExercises.sort((a,b)=>{
    if(sort==='name') return (a.name_cn||a.name).localeCompare(b.name_cn||b.name);
    if(sort==='level') return ['beginner','intermediate','expert'].indexOf(a.level||'')-['beginner','intermediate','expert'].indexOf(b.level||'');
    if(sort==='category') return (a.category||'').localeCompare(b.category||'');
    if(sort==='equipment') return (a.equipment||'').localeCompare(b.equipment||'');
    return 0;
  });
  currentPage=1; renderAll();
}

function renderAll(){
  document.getElementById('result-count').textContent=filteredExercises.length;
  renderGrid(); renderPagination();
}

function renderGrid(){
  const grid=document.getElementById('exercise-grid');
  const start=(currentPage-1)*PAGE_SIZE;
  const items=filteredExercises.slice(start,start+PAGE_SIZE);
  if(!items.length){
    grid.innerHTML='<div style="text-align:center;padding:60px 16px;color:var(--text-muted)"><p style="font-size:1rem">没有匹配的动作</p><p style="font-size:0.8125rem;margin-top:6px">尝试调整筛选条件</p></div>';
    return;
  }
  grid.className='exercise-grid'+(currentView==='list'?' list':'');
  grid.innerHTML=items.map((ex,i)=>{
    const isList=currentView==='list';
    const imgUrl=ex.images&&ex.images[0]?`${IMG_BASE}/${ex.images[0]}`:'';
    const pm=(ex.primaryMuscles_cn||ex.primaryMuscles||[]).map(m=>`<span>${m}</span>`).join('');
    const cnName=displayName(ex);
    const instPrev=displayInstructions(ex).slice(0,2).join(' ');
    return `<div class="exercise-card${isList?' list-view':''} animate-in" style="animation-delay:${i*50}ms" onclick="openDetail('${ex.id}')">
      <div class="card-img">${imgUrl?`<img src="${imgUrl}" alt="${cnName}" width="480" height="360" loading="lazy" onerror="this.parentElement.innerHTML='<span class=placeholder>🏋️</span>'">`:'<span class="placeholder">🏋️</span>'}</div>
      <div class="card-body">
        <h3>${cnName}</h3>
        <div class="card-tags">
          <span class="tag tag-level-${ex.level}">${ex.level_cn||formatLabel(ex.level)}</span>
          <span class="tag tag-category">${ex.category_cn||formatLabel(ex.category)}</span>
          ${ex.equipment?`<span class="tag tag-equipment">${ex.equipment_cn||formatLabel(ex.equipment)}</span>`:''}
        </div>
        <div class="card-muscles">${pm}</div>
        ${isList?`<div class="card-instructions">${instPrev}</div>`:''}
      </div></div>`;
  }).join('');
}

function renderPagination(){
  const total=Math.ceil(filteredExercises.length/PAGE_SIZE);
  const pag=document.getElementById('pagination');
  if(total<=1){pag.innerHTML='';return;}
  let h=`<button ${currentPage===1?'disabled':''} onclick="goPage(${currentPage-1})">‹ 上一页</button>`;
  for(let i=1;i<=total;i++) h+=`<button class="${i===currentPage?'active':''}" onclick="goPage(${i})">${i}</button>`;
  h+=`<button ${currentPage===total?'disabled':''} onclick="goPage(${currentPage+1})">下一页 ›</button>`;
  pag.innerHTML=h;
}

function goPage(p){ const total=Math.ceil(filteredExercises.length/PAGE_SIZE); if(p<1||p>total)return; currentPage=p; renderAll(); document.getElementById('exercise-grid').scrollIntoView({behavior:'smooth',block:'start'}); }
function setView(v){ currentView=v; document.getElementById('view-grid').classList.toggle('active',v==='grid'); document.getElementById('view-list').classList.toggle('active',v==='list'); renderGrid(); }

// ===== MODAL =====
function openDetail(id){
  const ex=allExercises.find(e=>e.id===id); if(!ex)return;
  const mc=document.getElementById('modal-content');
  const images=(ex.images||[]).map(img=>`${IMG_BASE}/${img}`);
  const cnName=displayName(ex);
  const cnInst=displayInstructions(ex);
  mc.innerHTML=`
    ${images.length>0?`<div class="modal-images">${images.map(src=>`<img src="${src}" alt="${cnName}" width="480" height="360" loading="lazy" onerror="this.style.display='none'">`).join('')}</div>`:''}
    <h2>${cnName}</h2>
    <div class="meta-row">
      <span class="meta-badge tag-level-${ex.level}">${ex.level_cn||formatLabel(ex.level)}</span>
      <span class="meta-badge tag-category">${ex.category_cn||formatLabel(ex.category)}</span>
      ${ex.equipment?`<span class="meta-badge tag-equipment">${ex.equipment_cn||formatLabel(ex.equipment)}</span>`:''}
      ${ex.force?`<span class="meta-badge" style="background:rgba(139,92,246,0.1);color:#A78BFA">${ex.force_cn||formatLabel(ex.force)}</span>`:''}
      ${ex.mechanic?`<span class="meta-badge" style="background:rgba(14,165,233,0.1);color:#38BDF8">${ex.mechanic_cn||formatLabel(ex.mechanic)}</span>`:''}
    </div>
    ${(ex.primaryMuscles||[]).length>0?`<div class="modal-section"><h3>目标肌群</h3><div class="modal-muscles">${(ex.primaryMuscles_cn||ex.primaryMuscles||[]).map(m=>`<span class="muscle-tag">${m}</span>`).join('')}${(ex.secondaryMuscles_cn||ex.secondaryMuscles||[]).map(m=>`<span class="muscle-tag secondary">${m}</span>`).join('')}</div></div>`:''}
    ${cnInst.length>0?`<div class="modal-section"><h3>动作步骤</h3><ol>${cnInst.map(inst=>`<li>${inst}</li>`).join('')}</ol></div>`:''}
    <div class="modal-actions">
      <button class="btn-add-plan" id="modal-add-btn" onclick="addToPlan('${ex.id}')">+ 加入训练计划</button>
      <button class="btn-outline" onclick="closeModal()">关闭</button>
    </div>`;
  document.getElementById('modal-overlay').classList.add('open');
  document.body.style.overflow='hidden';
  // 记住当前焦点，关闭时恢复
  var overlay=document.getElementById('modal-overlay');
  overlay._prevFocus=document.activeElement;
  // 聚焦到关闭按钮
  var closeBtn=overlay.querySelector('.modal-close');
  if(closeBtn) setTimeout(function(){closeBtn.focus();},50);
}

// P1-1: ESC 关闭模态框
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'){
    var mo=document.getElementById('modal-overlay');
    if(mo&&mo.classList.contains('open')) closeModal();
    var so=document.getElementById('share-overlay');
    if(so&&so.classList.contains('open')) closeShareModal();
    var vo=document.getElementById("video-overlay");
    if(vo&&vo.classList.contains("open")) closeVideoModal();
  }
});

function closeModal(){
  var overlay=document.getElementById('modal-overlay');
  overlay.classList.remove('open');
  document.body.style.overflow='';
  // 焦点恢复
  var prev=overlay._prevFocus;
  if(prev&&prev.focus) prev.focus();
}

// ===== WORKOUT PLANNER =====
function addToPlan(id){
  const plan=getPlan();
  if(!plan[currentDay]) plan[currentDay]=[];
  if(plan[currentDay].some(e=>e.id===id)){showToast('该动作已在当天计划中');return;}
  plan[currentDay].push({id,sets:3,reps:'12'});
  savePlan(plan);
  const btn=document.getElementById('modal-add-btn');
  btn.textContent='✓ 已添加'; btn.classList.add('added');
  setTimeout(()=>{if(btn){btn.textContent='+ 加入训练计划';btn.classList.remove('added');}},1500);
  showToast('已添加到训练计划');
}

function showPlanner(){
  document.getElementById('browser-panel').style.display='none';
  document.getElementById('planner-panel').classList.add('active');
  document.getElementById('nav-browse').classList.remove('active');
  document.getElementById('nav-planner').classList.add('active');
  renderPlanner();
}

function showBrowser(){
  document.getElementById('browser-panel').style.display='block';
  document.getElementById('planner-panel').classList.remove('active');
  document.getElementById('nav-browse').classList.add('active');
  document.getElementById('nav-planner').classList.remove('active');
}

function renderPlanner(){
  document.getElementById('planner-tabs').innerHTML=DAYS.map(d=>
    `<button class="planner-day-tab${d===currentDay?' active':''}" onclick="switchDay('${d}')">${DAY_LABELS[d]}</button>`
  ).join('');
  const plan=getPlan();
  const exercises=plan[currentDay]||[];
  const routineDiv=document.getElementById('planner-routine');
  if(!exercises.length){
    routineDiv.innerHTML=`<div class="planner-empty"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.5" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="3"/><line x1="9" y1="9" x2="15" y2="9"/><line x1="9" y1="13" x2="15" y2="13"/></svg><h3>${DAY_LABELS[currentDay]} 暂无训练安排</h3><p>前往动作库选择动作加入计划</p></div>`;
    return;
  }
  routineDiv.innerHTML=exercises.map((item,i)=>{
    const ex=allExercises.find(e=>e.id===item.id); if(!ex)return'';
    return`<div class="planner-exercise animate-in" style="animation-delay:${i*40}ms">
      <div class="ex-num">${i+1}</div>
      <div class="ex-info"><h4>${displayName(ex)}</h4><div class="ex-meta">${ex.level_cn||formatLabel(ex.level)} · ${ex.category_cn||formatLabel(ex.category)} · ${(ex.primaryMuscles_cn||ex.primaryMuscles||[]).join('、')}</div></div>
      <div class="ex-sets"><label>组</label><input type="number" min="1" max="10" value="${item.sets}" onchange="updateSets(${i},'sets',this.value)"><label>次</label><input type="text" value="${item.reps}" onchange="updateSets(${i},'reps',this.value)"></div>
      <button class="ex-video" onclick="openVideoSearch('${ex.id}')" title="视频教程">📺 视频</button>
      <button class="ex-remove" onclick="removeFromPlan(${i})" title="移除">✕</button>
    </div>`;
  }).join('');
}

function switchDay(day){currentDay=day;renderPlanner();}
function updateSets(i,f,v){const p=getPlan();p[currentDay][i][f]=f==='sets'?parseInt(v)||1:v;savePlan(p);}
function removeFromPlan(i){const p=getPlan();p[currentDay].splice(i,1);savePlan(p);renderPlanner();}
function clearDay(){const p=getPlan();p[currentDay]=[];savePlan(p);renderPlanner();}
function clearAllPlan(){if(!confirm('确定清空所有训练计划？'))return;localStorage.removeItem('fitforge_plan');renderPlanner();updatePlanBadge();}

function exportPlan(){
  const plan=getPlan(); let text='🏋️ FitForge 训练计划\n'+'='.repeat(40)+'\n\n';
  DAYS.forEach(d=>{
    const exercises=plan[d]||[]; if(!exercises.length)return;
    text+=`📅 ${DAY_LABELS[d]}\n${'-'.repeat(20)}\n`;
    exercises.forEach((item,i)=>{
      const ex=allExercises.find(e=>e.id===item.id);
      if(ex){text+=`  ${i+1}. ${displayName(ex)} — ${item.sets}组 × ${item.reps}次\n`;if(ex.primaryMuscles)text+=`     目标: ${ex.primaryMuscles.map(formatLabel).join('、')}\n`;}
    });
    text+='\n';
  });
  const blob=new Blob([text],{type:'text/plain'}); const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download='FitForge_训练计划.txt'; a.click(); URL.revokeObjectURL(url);
  showToast('训练计划已导出');
}

function updatePlanBadge(){
  const plan=getPlan(); let count=0;
  Object.values(plan).forEach(arr=>{if(Array.isArray(arr))count+=arr.length;});
  document.getElementById('plan-count').textContent=count;
}

// ===== SHARE =====
function encodeShareData(plan){
  var data={plan:plan,v:1};
  var json=JSON.stringify(data);
  return btoa(encodeURIComponent(json).replace(/%([0-9A-F]{2})/g,function(_,p){
    return String.fromCharCode(parseInt(p,16));
  }));
}
function openShareModal(){
  var overlay=document.getElementById('share-overlay');
  overlay._prevFocus=document.activeElement;
  var plan=getPlan();
  var qrWrap=document.getElementById('qr-code');
  qrWrap.innerHTML='';
  var encoded=encodeShareData(plan);
  var shareUrl=SHARE_BASE_URL+'#share='+encoded;
  try{new QRCode(qrWrap,{text:shareUrl,width:220,height:220,colorDark:'#0F172A',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.M});}
  catch(e){qrWrap.innerHTML='<p style="color:#F87171;font-size:0.75rem">QR 生成失败，请复制链接分享</p>';}
  var urlBox=document.getElementById('share-url-box');
  urlBox.value=shareUrl; urlBox.style.display='block';
  var preview=document.getElementById('share-plan-preview');
  var hasEx=false; var pt='FitForge 训练计划\n\n';
  DAYS.forEach(function(d){
    var exs=plan[d]||[]; if(!exs.length) return; hasEx=true; pt+=DAY_LABELS[d]+':\n';
    exs.forEach(function(item,i){
      var ex=allExercises.find(function(e){return e.id===item.id});
      if(ex) pt+='  '+(i+1)+'. '+displayName(ex)+' - '+item.sets+'组x'+item.reps+'次\n';
    }); pt+='\n';
  });
  if(!hasEx) pt='暂无训练安排，请先在训练计划中添加动作';
  preview.style.display='block'; preview.textContent=pt;
  document.getElementById('share-overlay').classList.add('open');
  // 聚焦到分享框
  setTimeout(function(){
    var box=document.getElementById('share-url-box');
    if(box) box.focus();
  },50);
  document.body.style.overflow='hidden';
}
function copyShareUrl(){
  var urlBox=document.getElementById('share-url-box');
  urlBox.select(); navigator.clipboard.writeText(urlBox.value).catch(function(){document.execCommand('copy');});
  var btn=document.getElementById('btn-copy-url');
  btn.textContent='已复制!'; btn.classList.add('copied');
  setTimeout(function(){btn.textContent='复制链接'; btn.classList.remove('copied');},2000);
}
function closeShareModal(){
  document.getElementById('share-overlay').classList.remove('open');
  document.body.style.overflow = '';
}

function downloadShareFile(){
  var plan=getPlan();
  var exerciseMap = {};
  DAYS.forEach(function(d){
    (plan[d]||[]).forEach(function(item){
      var ex=allExercises.find(function(e){return e.id===item.id});
      if(ex){
        exerciseMap[ex.id] = {
          id: ex.id,
          name: displayName(ex),
          level_cn: ex.level_cn || formatLabel(ex.level),
          category_cn: ex.category_cn || formatLabel(ex.category),
          primaryMuscles_cn: ex.primaryMuscles_cn || (ex.primaryMuscles||[]).map(formatLabel),
          instructions_cn: displayInstructions(ex)
        };
      }
    });
  });
  var shareHtml = buildStandalonePage(plan, exerciseMap);
  var blob = new Blob([shareHtml], {type: 'text/html;charset=utf-8'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = 'FitForge_训练计划分享.html';
  a.click();
  URL.revokeObjectURL(url);
  showToast('分享文件已下载，可通过微信发送给好友');
}

function buildStandalonePage(plan, exerciseMap){
  return '<!DOCTYPE html>\n<html lang=\"zh-CN\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width,initial-scale=1.0\">\n<title>FitForge 训练计划分享</title>\n<style>' +
    '*{box-sizing:border-box;margin:0;padding:0}body{font-family:-apple-system,BlinkMacSystemFont,\"Segoe UI\",sans-serif;background:#0F172A;color:#E2E8F0;padding:20px;min-height:100vh}' +
    'h1{font-family:\"Barlow Condensed\",sans-serif;font-size:1.5rem;color:#F97316;text-align:center;margin-bottom:20px}' +
    '.day-card{background:#1E293B;border:1px solid #334155;border-radius:12px;padding:16px;margin-bottom:14px}' +
    '.day-title{font-size:1rem;font-weight:700;color:#F8FAFC;margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid #334155}' +
    '.ex-item{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid rgba(51,65,85,0.5)}' +
    '.ex-item:last-child{border-bottom:none}' +
    '.ex-num{width:26px;height:26px;background:#F97316;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:0.75rem;color:#fff;flex-shrink:0}' +
    '.ex-info{flex:1;min-width:0}' +
    '.ex-name{font-size:0.875rem;font-weight:600;color:#F8FAFC;margin-bottom:3px;cursor:pointer}' +
    '.ex-meta{font-size:0.6875rem;color:#94A3B8}' +
    '.ex-dose{font-size:0.75rem;color:#FB923C;font-weight:600;white-space:nowrap}' +
    '.ex-steps{margin-top:6px;font-size:0.6875rem;color:#94A3B8;line-height:1.6;display:none}' +
    '.ex-steps li{margin-bottom:3px}' +
    '.ex-steps li::marker{color:#F97316}' +
    '.ex-video-link{display:inline-block;margin-top:6px;font-size:0.6875rem;color:#60A5FA;text-decoration:none;border:1px solid rgba(59,130,246,0.3);padding:3px 8px;border-radius:6px;transition:all .2s}.ex-video-link:hover{background:rgba(59,130,246,0.1);border-color:#3B82F6}' +
    '.empty{text-align:center;padding:40px 16px;color:#94A3B8}' +
    '.footer{text-align:center;margin-top:24px;padding-top:16px;border-top:1px solid #334155;color:#64748B;font-size:0.6875rem}' +
    '<\/style>\n<\/head>\n<body>\n<h1>FitForge 训练计划</h1>\n' +
    buildPlanHTML(plan, exerciseMap) +
    '<div class=\"footer\">由 FitForge 生成 \u00b7 点击动作名称展开教学步骤<\/div>\n' +
    '<script>document.querySelectorAll(\".ex-name\").forEach(function(el){el.addEventListener(\"click\",function(){var s=el.parentElement.querySelector(\".ex-steps\");if(s)s.style.display=s.style.display===\"none\"?\"block\":\"none\"})});<\/script>\n<\/body>\n<\/html>';
}

function buildPlanHTML(plan, exerciseMap){
  var html = '';
  var hasAny = false;
  DAYS.forEach(function(d){
    var exercises=plan[d]||[];
    if(!exercises.length) return;
    hasAny = true;
    html += '<div class=\"day-card\"><div class=\"day-title\">' + DAY_LABELS[d] + '<\/div>';
    exercises.forEach(function(item,i){
      var ex = exerciseMap[item.id];
      if(!ex) return;
      html += '<div class=\"ex-item\"><div class=\"ex-num\">' + (i+1) + '<\/div>';
      html += '<div class=\"ex-info\"><div class=\"ex-name\">' + ex.name + '<\/div>';
      html += '<div class=\"ex-meta\">' + ex.level_cn + ' \u00b7 ' + ex.category_cn + ' \u00b7 ' + (ex.primaryMuscles_cn||[]).join('\u3001') + '<\/div>';
      if(ex.instructions_cn && ex.instructions_cn.length > 0){
        html += '<ol class=\"ex-steps\">' + ex.instructions_cn.map(function(s){return '<li>'+s+'<\/li>'}).join('') + '<\/ol>';
      }
      html += '<\/div>';
      html += '<div class=\"ex-dose\">' + item.sets + '\u7ec4 x ' + item.reps + '\u6b21<\/div>';
      html += '<a class="ex-video-link" href="https://search.bilibili.com/all?keyword=' + encodeURIComponent('健身 ' + ex.name) + '&order=click" target="_blank" rel="noopener">📺 观看教程</a>';
      html += '<\/div>';
    });
    html += '<\/div>';
  });
  if(!hasAny) html += '<div class=\"empty\">\u6682\u65e0\u8bad\u7ec3\u5b89\u6392<\/div>';
  return html;
}

// Load shared plan from URL hash
function loadSharedPlan(){
  const hash = window.location.hash;
  if (hash.startsWith('#share=')) {
    try {
      const encoded = hash.substring(7);
      const json = decodeURIComponent(atob(encoded).split('').map(function(c){
        return '%'+c.charCodeAt(0).toString(16).padStart(2,'0');
      }).join(''));
      const shareData = JSON.parse(json);
      if (shareData.plan) {
        localStorage.setItem('fitforge_plan', JSON.stringify(shareData.plan));
        updatePlanBadge();
        showToast('已加载分享的训练计划');
        showPlanner();
        // Clean URL
        history.replaceState(null, '', window.location.pathname);
      }
    } catch(e) { /* ignore invalid share data */ }
  }
}

// ===== TOAST =====
function showToast(msg){
  const toast=document.getElementById('toast');
  toast.textContent=msg; toast.classList.add('show');
  clearTimeout(toast._timeout); toast._timeout=setTimeout(()=>toast.classList.remove('show'),2000);
}

// ===== 视频教程搜索 =====
// 打开视频搜索 —— B站API搜索 + 内嵌播放器
var videoSearchResults = [];

function openVideoSearch(exerciseId) {
  var ex = allExercises.find(function(e) { return e.id === exerciseId; });
  if (!ex) { console.warn('未找到动作:', exerciseId); return; }
  var cnName = displayName(ex);
  var keywordRaw = '健身教程 ' + cnName;
  var keyword = encodeURIComponent(keywordRaw);

  document.getElementById('video-title').textContent = '📺 ' + cnName + ' - 视频教程';
  document.getElementById('video-subtitle').textContent = '正在B站搜索「' + keywordRaw + '」…';
  document.getElementById('link-bilibili').href = 'https://search.bilibili.com/all?keyword=' + keyword + '&order=click';
  document.getElementById('link-douyin').href = 'https://www.douyin.com/search/' + keyword + '?type=general';
  document.getElementById('video-results').innerHTML = '<div class="video-loading">🔍 正在搜索B站视频...</div>';
  document.getElementById('video-search-links').style.display = 'none';
  document.getElementById('video-overlay').classList.add('open');
  document.body.style.overflow = 'hidden';

  var apiUrl = 'https://api.bilibili.com/x/web-interface/search/type?search_type=video&keyword=' + keyword + '&page=1';
  fetch(apiUrl)
    .then(function(res) { return res.json(); })
    .then(function(json) {
      videoSearchResults = (json.data && json.data.result) || [];
      if (!videoSearchResults.length) throw new Error('无搜索结果');
      renderVideoList();
      // 自动播放第一个视频
      playVideo(0);
    })
    .catch(function(err) {
      console.warn('B站API失败:', err.message);
      fallbackVideoLinks(keywordRaw);
    });
}

function renderVideoList() {
  var html = '';
  videoSearchResults.slice(0, 8).forEach(function(v, i) {
    var title = (v.title || '').replace(/<em class="keyword">/g, '').replace(/<\/em>/g, '');
    var author = v.author || '';
    var play = v.play || 0;
    var playStr = play > 10000 ? (play/10000).toFixed(1) + '万' : play;
    var pic = v.pic || '';
    var duration = v.duration || '';
    html += '<div class="video-item' + (i===0?' active':'') + '" onclick="playVideo(' + i + ')" id="vitem-' + i + '">' +
      '<img class="thumb" src="' + pic + '@200w.jpg" alt="" loading="lazy" onerror="this.style.display=' + "'none'" + '">' +
      '<div class="v-info">' +
        '<div class="v-title">' + title + '</div>' +
        '<div class="v-meta">' + author + ' · ▶ ' + playStr + '播放' + (duration ? ' · ' + duration : '') + '</div>' +
      '</div>' +
    '</div>';
  });
  document.getElementById('video-results').innerHTML = '<div class="video-player-wrap" id="video-player-wrap"></div><div class="video-list-label">更多相关视频</div>' + html;
}

function playVideo(index) {
  var v = videoSearchResults[index];
  if (!v || !v.bvid) return;
  // 高亮当前选中
  var items = document.querySelectorAll('.video-item');
  items.forEach(function(item, i) { item.classList.toggle('active', i === index); });
  // 嵌入B站播放器
  var playerHtml = '<div class="video-embed">' +
    '<iframe src="//player.bilibili.com/player.html?bvid=' + v.bvid + '&page=1&high_quality=1&autoplay=1&danmaku=0" ' +
      'allowfullscreen allow="autoplay; encrypted-media; fullscreen" ' +
      'sandbox="allow-scripts allow-same-origin allow-popups allow-presentation" ' +
      'style="width:100%;height:100%;border:none;border-radius:8px" ' +
      'loading="lazy">' +
    '</iframe></div>';
  document.getElementById('video-player-wrap').innerHTML = playerHtml;
  // 显示搜索链接
  document.getElementById('video-search-links').style.display = 'flex';
}

function fallbackVideoLinks(keywordRaw) {
  document.getElementById('video-search-links').style.display = 'flex';
  document.getElementById('video-results').innerHTML =
    '<div style="text-align:center;padding:30px 20px;color:var(--text-muted)">' +
    '<p style="margin-bottom:12px;color:var(--text-heading);font-size:15px">⚠️ B站API暂不可用</p>' +
    '<p style="margin-bottom:16px;font-size:13px">点击下方按钮在新标签页搜索「' + keywordRaw + '」</p>' +
    '</div>';
}

function closeVideoModal() {
  document.getElementById('video-overlay').classList.remove('open');
  document.body.style.overflow = '';
  // 停止iframe播放
  var wrap = document.getElementById('video-player-wrap');
  if (wrap) wrap.innerHTML = '';
  videoSearchResults = [];
}

function closeVideoModal() {
  document.getElementById('video-overlay').classList.remove('open');
  document.body.style.overflow = '';
}

// ===== INIT =====
loadData(); updatePlanBadge(); loadSharedPlan();
</script>
